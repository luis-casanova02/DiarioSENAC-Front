<header>
    <div id="header-logo">
        <h2>Meu Diário</h2>
        <h2>SENAC</h2>
    </div>
    <div id="header-titulo">
        <p>Registre seus pensamentos</p>
        <p>e anotações</p>
    </div>
    <div id="header-avatar">
        <button id="avatar-clicavel"></button>
        <div id="avatar-nome-menu">
            <h3>Nome do Usuário</h3>
            <a href="javascript:void(0)">Editar perfil</a>
        </div>
    </div>
</header>

<main>
    <h2>Registros</h2>
    <div id="registros container" *ngFor="let registro of registroOrigem">
        <app-card-registros [registro]="registro"></app-card-registros>
    </div>
    

    <button id="adicionar-registro" (click)="modalSolicitado = true">
        <span>+</span>
    </button>
</main>

@if (modalSolicitado) {
    <div id="modal-container">
        <section id="modal">
            <div id="modal-header">
                <h2>Adicionar Registro</h2>
                <button id="modal-fechar" (click)="modalSolicitado = false">X</button>
            </div>
            <form id="modal-form">
                <div id="modal-form-campos">
                    <label for="titulo">Título:</label>
                    <input type="text" id="titulo" name="titulo" required [(ngModel)]="novoRegistro.titulo">

                    <label for="conteudo">Conteúdo:</label>
                    <textarea id="conteudo" name="conteudo" required [(ngModel)]="novoRegistro.conteudo"></textarea>

                    <label for="data">Data:</label>
                    <input type="date" id="data" name="data" required [(ngModel)]="novoRegistro.data">
                </div>

                <div id="modal-form-botoes">
                    <button type="submit">Salvar</button>
                </div>
            </form>
        </section>
    </div>
}
