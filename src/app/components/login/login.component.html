<main>
	<h1>Meu Diário SENAC</h1>

	<form (ngSubmit)="autenticar()">
		<div>
			<label for="nome">Nome</label>
			<input id="nome" [(ngModel)]="nome" type="text" autocomplete="username" required>
		</div>

		<div>
			<label for="senha">Senha</label>
			<input id="senha" [(ngModel)]="senha" type="password" autocomplete="current-password" required>
		</div>

		<button type="submit">Entrar</button>
	</form>
</main>
